[package]
name = "statebook-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Pure local terminal semantic normalization and StateKeyV1 derivation for Statebook."

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
ring = "=0.17.14"
