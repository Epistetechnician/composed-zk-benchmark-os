[package]
name = "statebook-report"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Portable digest-bound audit bundles and hermetic evidence adapters for Statebook P5."

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
ring = "=0.17.14"
statebook-settlement = { path = "../statebook-settlement" }
tempfile = "3"
