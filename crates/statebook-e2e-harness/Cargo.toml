[package]
name = "statebook-e2e-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Hermetic P1-P7 evaluation and falsification harness for Statebook P8."

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
statebook-authority = { path = "../statebook-authority" }
statebook-core = { path = "../statebook-core" }
statebook-report = { path = "../statebook-report" }
statebook-settlement = { path = "../statebook-settlement" }
statebook-source = { path = "../statebook-source" }

[dev-dependencies]
tempfile = "3"
