[package]
name = "hsai-attestation-phala"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phala/dstack managed Trust Center artifact validator that emits Attested anchor-validity envelopes from real captured evidence."

[dependencies]
hsai-agent-case = { path = "../hsai-agent-case" }
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
hsai-distinct-agent = { path = "../hsai-distinct-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
