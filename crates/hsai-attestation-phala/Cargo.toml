[package]
name = "hsai-attestation-phala"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Deterministic fixture-oriented Phala/dstack attestation backend preparation for HSAI."

[dependencies]
hsai-agent-case = { path = "../hsai-agent-case" }
hsai-attestation = { path = "../hsai-attestation" }
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
hsai-distinct-agent = { path = "../hsai-distinct-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }

[features]
default = []
operator-live-provider = ["dep:ureq"]
operator-live-tls-channel = ["dep:rustls", "dep:webpki-roots"]
