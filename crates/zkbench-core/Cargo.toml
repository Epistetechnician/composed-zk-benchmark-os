[package]
name = "zkbench-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Core DSL, Semantic IR, oracle, evidence, and scoring primitives for Composed ZK Benchmark OS."

[features]
default = []
external-runner = []

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
