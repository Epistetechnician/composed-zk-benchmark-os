[package]
name = "hsai-distinct-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Conditional distinct-agent lane and minimal identity registry for Hyper Sacred AI."

[dependencies]
hsai-agent-case = { path = "../hsai-agent-case" }
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
