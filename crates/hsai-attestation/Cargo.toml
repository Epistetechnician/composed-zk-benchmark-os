[package]
name = "hsai-attestation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fail-closed attestation-verification lane: turns an authenticated managed attestation token into a ClaimEnvelope guaranteeing anchor validity (Attested, never Proven)."

[dependencies]
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
hsai-agent-case = { path = "../hsai-agent-case" }
hsai-distinct-agent = { path = "../hsai-distinct-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
hsai-economy = { path = "../hsai-economy" }
hsai-membrane = { path = "../hsai-membrane" }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
