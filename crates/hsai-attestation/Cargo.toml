[package]
name = "hsai-attestation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Interface-level attestation-verification lane: turns a managed attestation token into a ClaimEnvelope guaranteeing anchor validity (Attested, never Proven). The reference verifier does NOT check the managed service signature."

[dependencies]
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
hsai-agent-case = { path = "../hsai-agent-case" }
hsai-distinct-agent = { path = "../hsai-distinct-agent" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
hsai-economy = { path = "../hsai-economy" }
hsai-membrane = { path = "../hsai-membrane" }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
