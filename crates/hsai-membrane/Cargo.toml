[package]
name = "hsai-membrane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Bounded in-memory membrane between HSAI internal credits and opaque external units."

[dependencies]
hsai-claim-envelope = { path = "../hsai-claim-envelope" }
hsai-distinct-agent = { path = "../hsai-distinct-agent" }
hsai-economy = { path = "../hsai-economy" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
hsai-agent-case = { path = "../hsai-agent-case" }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
