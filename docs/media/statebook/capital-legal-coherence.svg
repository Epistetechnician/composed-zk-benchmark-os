<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="capital-title capital-desc">
  <title id="capital-title">Economic offset, recognized capital, and legal finality are distinct</title>
  <desc id="capital-desc">A three-layer model separates economic payoff offset, a named authority's recognized margin model, and enforceable netting and finality. Each layer has additional conditions and cannot be inferred from the layer below.</desc>
  <defs>
    <style>
      .i{fill:#162b45}.m{fill:#667789}.h{font:700 54px Georgia,serif}.k{font:700 23px ui-monospace,Consolas,monospace;letter-spacing:2px}.t{font:700 32px Georgia,serif}.b{font:28px Georgia,serif}.x{font:23px ui-monospace,Consolas,monospace}.n{fill:#fffdfa;stroke:#173a63;stroke-width:3}.a{fill:#fff3cf;stroke:#c38508;stroke-width:3}.r{fill:#fbe9e7;stroke:#b3423c;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbf8f1"/>
  <text x="70" y="72" class="k i">FIG 10 / CAPITAL AND LEGAL COHERENCE</text>
  <text x="70" y="136" class="h i">Offset is not recognition. Recognition is not finality.</text>
  <text x="70" y="178" class="b m">The three layers are separately governed and must each be evidenced in context.</text>
  <rect x="140" y="250" width="1320" height="130" rx="20" class="n"/>
  <text x="182" y="302" class="k i">1 / ECONOMIC PAYOFF OFFSET</text>
  <text x="182" y="346" class="b i">same declared domain · candidate portfolio · explicit residual</text>
  <text x="1080" y="330" class="t i">mathematical relation</text>
  <rect x="220" y="420" width="1160" height="192" rx="20" class="a"/>
  <text x="262" y="468" class="k i">2 / RECOGNIZED CAPITAL RELIEF</text>
  <text x="262" y="510" class="b i"><tspan x="262">named authority · account/entity · model/version · haircut</tspan><tspan x="262" dy="28">liquidation horizon</tspan></text>
  <text x="262" y="568" class="x m"><tspan x="262">the authority may deny, cap, or change recognition</tspan><tspan x="262" dy="24">despite economic offset</tspan></text>
  <rect x="300" y="648" width="1000" height="164" rx="20" class="r"/>
  <text x="342" y="696" class="k i">3 / ENFORCEABLE NETTING AND FINALITY</text>
  <text x="342" y="734" class="b i"><tspan x="342">jurisdiction · close-out netting · customer protection</tspan><tspan x="342" dy="28">default process · finality domain</tspan></text>
  <text x="342" y="794" class="x m">technical transfer does not establish legal discharge</text>
  <rect x="70" y="842" width="1460" height="42" rx="12" class="r"/>
  <text x="98" y="871" class="k i">A STATEBOOK CAN REPORT THE GAP. IT DOES NOT GRANT MARGIN, CLEARING, OR LEGAL AUTHORITY.</text>
</svg>
