<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seven independent Statebook completeness tests</title>
  <desc id="desc">Seven gates show semantic, payoff, execution, capital, settlement, assurance, and recovery completeness. No aggregate complete boolean is allowed.</desc>
  <defs><style>.h{font:700 52px Georgia,serif;fill:#17283b}.sub{font:20px 'Courier New',monospace;fill:#5f6b73}.n{font:700 44px Georgia,serif;fill:#fffdf8}.t{font:700 25px Georgia,serif;fill:#17283b}.b{font:18px Georgia,serif;fill:#344554}.m{font:16px 'Courier New',monospace;fill:#5f6b73}.card{fill:#fffdf8;stroke:#1e3a5f;stroke-width:2}.circle{fill:#1e3a5f}.warn{fill:#f8e8e5;stroke:#9b3a37;stroke-width:2}</style></defs>
  <rect width="1600" height="900" fill="#faf7ef"/>
  <text x="70" y="72" class="h">Seven completeness tests. Seven verdicts.</text><text x="70" y="112" class="sub">Passing one dimension never populates another.</text>
  <g transform="translate(70 165)">
    <g><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">1</text><text x="102" y="58" class="t">Semantic</text><text x="28" y="112" class="b">Are all material terms and</text><text x="28" y="140" class="b">states represented?</text><text x="28" y="190" class="m">Unknown terms block exactness.</text></g>
    <g transform="translate(375 0)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">2</text><text x="102" y="58" class="t">Payoff</text><text x="28" y="112" class="b">Does the portfolio span the</text><text x="28" y="140" class="b">target over the declared domain?</text><text x="28" y="190" class="m">Residuals remain explicit.</text></g>
    <g transform="translate(750 0)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">3</text><text x="102" y="58" class="t">Execution</text><text x="28" y="112" class="b">Can every leg fill at size,</text><text x="28" y="140" class="b">price, time, and failure bound?</text><text x="28" y="190" class="m">Theory does not fill a book.</text></g>
    <g transform="translate(1125 0)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">4</text><text x="102" y="58" class="t">Capital</text><text x="28" y="112" class="b">Does a named authority</text><text x="28" y="140" class="b">recognize the offset?</text><text x="28" y="190" class="m">Economics cannot grant margin.</text></g>
    <g transform="translate(188 275)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">5</text><text x="102" y="58" class="t">Settlement</text><text x="28" y="112" class="b">Do linked obligations reach</text><text x="28" y="140" class="b">compatible finality?</text><text x="28" y="190" class="m">Technical ≠ legal finality.</text></g>
    <g transform="translate(563 275)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">6</text><text x="102" y="58" class="t">Assurance</text><text x="28" y="112" class="b">Are current action-bound</text><text x="28" y="140" class="b">evidence and budgets valid?</text><text x="28" y="190" class="m">Trust is not one score.</text></g>
    <g transform="translate(938 275)"><rect width="350" height="240" rx="16" class="card"/><circle cx="54" cy="54" r="31" class="circle"/><text x="42" y="70" class="n">7</text><text x="102" y="58" class="t">Recovery</text><text x="28" y="112" class="b">Can every path stop, reconcile,</text><text x="28" y="140" class="b">restore, and reopen safely?</text><text x="28" y="190" class="m">A pause switch is not recovery.</text></g>
  </g>
  <rect x="220" y="755" width="1160" height="78" rx="14" class="warn"/><text x="300" y="803" class="h" style="font-size:29px">No aggregate complete = true. The weakest relevant verdict controls.</text>
</svg>
