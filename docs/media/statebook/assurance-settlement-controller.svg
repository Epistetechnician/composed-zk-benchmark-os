<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Independent assurance controls and a lexicographic release decision</title>
  <desc id="desc">A request is evaluated by four independent controls in a fixed order: whether it is authorized, how much capacity remains, when it may act, and what happens next. No score compensates for a hard failure in another control.</desc>
  <defs><style>.ink{fill:#162b45}.muted{fill:#667789}.h{font:700 56px Georgia,serif}.t{font:700 28px Georgia,serif}.b{font:25px Georgia,serif}.k{font:700 22px ui-monospace,Consolas,monospace;letter-spacing:1.5px}.x{font:21px ui-monospace,Consolas,monospace}.navy{fill:#fffdfa;stroke:#173a63;stroke-width:3}.teal{fill:#edf7f4;stroke:#19766f;stroke-width:3}.gold{fill:#fff3cf;stroke:#c38508;stroke-width:3}.red{fill:#fbe9e7;stroke:#b3423c;stroke-width:3}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#173a63"/></marker></defs>
  <rect width="1600" height="900" fill="#fbf8f1"/>
  <text x="70" y="72" class="k ink">FIG 06 / ASSURANCE AND SETTLEMENT CONTROL</text>
  <text x="70" y="136" class="h ink">Independent controls. Lexicographic release decision.</text>
  <text x="70" y="178" class="b muted">Evaluation order is visible. A pass in one control cannot offset a failure in another.</text>
  <rect x="70" y="290" width="210" height="126" rx="18" class="navy"/><text x="102" y="338" class="t ink">Request Q</text><text x="102" y="378" class="x muted">intent · amount · route</text>
  <path d="M280 353H370" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="370" y="242" width="430" height="126" rx="18" class="red"/><text x="402" y="290" class="k ink">1 / WHETHER</text><text x="402" y="330" class="t ink">Authorization and hard gates</text><text x="402" y="358" class="x muted">source · state · replay · solvency</text>
  <rect x="850" y="242" width="430" height="126" rx="18" class="gold"/><text x="882" y="290" class="k ink">2 / HOW MUCH</text><text x="882" y="330" class="t ink">Remaining capacity</text><text x="882" y="358" class="x muted">account · asset · destination · route</text>
  <rect x="370" y="448" width="430" height="126" rx="18" class="gold"/><text x="402" y="496" class="k ink">3 / WHEN</text><text x="402" y="536" class="t ink">Applicable risk clock</text><text x="402" y="564" class="x muted">novelty · amount · anomaly · recovery</text>
  <rect x="850" y="448" width="430" height="126" rx="18" class="navy"/><text x="882" y="496" class="k ink">4 / WHAT HAPPENS NEXT</text><text x="882" y="536" class="t ink">Action-bound recovery state</text><text x="882" y="564" class="x muted">reserve · observe · reconcile · freeze</text>
  <path d="M800 305H850 M1065 368V448 M850 511H800 M585 574V656" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="370" y="656" width="910" height="112" rx="18" class="teal"/>
  <text x="408" y="702" class="t ink">Decision record</text><text x="408" y="740" class="x muted">executed · queued · rejected · frozen / explicit reason and recovery owner</text>
  <rect x="70" y="824" width="1460" height="42" rx="12" class="navy"/>
  <text x="98" y="853" class="k ink">FAST INSIDE THE RECOVERY DOMAIN. GATED AT UNILATERAL IRREVERSIBLE EXTERNALIZATION.</text>
</svg>
