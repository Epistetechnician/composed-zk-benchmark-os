<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Order book versus Statebook teaching meme</title>
  <desc id="desc">The left panel shows an order book matching one contract. The right panel shows a Statebook asking whether differently labeled contracts describe the same state, can execute, receive margin recognition, and settle.</desc>
  <style>.big{font:700 58px Georgia,serif;fill:#17283b}.head{font:700 28px 'Courier New',monospace;fill:#17283b}.body{font:25px Georgia,serif;fill:#263746}.mono{font:18px 'Courier New',monospace;fill:#5f6b73}.left{fill:#edf3f0;stroke:#3d776f;stroke-width:3}.right{fill:#f6edcf;stroke:#b78619;stroke-width:3}.line{stroke:#1e3a5f;stroke-width:3}.pill{fill:#fffdf8;stroke:#1e3a5f;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#faf7ef"/>
  <text x="80" y="85" class="big">The order book was built for one contract.</text>
  <text x="80" y="130" class="mono">The Statebook starts when several contracts describe pieces of the same world.</text>
  <rect x="70" y="180" width="690" height="620" rx="20" class="left"/>
  <rect x="840" y="180" width="690" height="620" rx="20" class="right"/>
  <text x="115" y="235" class="head">ORDER BOOK</text><text x="885" y="235" class="head">STATEBOOK</text>
  <g transform="translate(130 295)">
    <text x="0" y="0" class="body">One identified contract</text>
    <rect x="0" y="45" width="560" height="72" rx="10" class="pill"/><text x="26" y="88" class="mono">BUY  101.20  ·  24 units</text>
    <rect x="0" y="132" width="560" height="72" rx="10" class="pill"/><text x="26" y="175" class="mono">SELL 101.30  ·  19 units</text>
    <line x1="280" y1="222" x2="280" y2="340" class="line"/>
    <path d="M250 315L280 345L310 315" fill="none" class="line"/>
    <text x="85" y="390" class="big" style="font-size:42px">“I match orders.”</text>
    <text x="58" y="438" class="mono">Correct question. Local scope.</text>
  </g>
  <g transform="translate(900 285)">
    <rect x="0" y="0" width="185" height="64" rx="32" class="pill"/><text x="22" y="39" class="mono">event claim</text>
    <rect x="205" y="0" width="155" height="64" rx="32" class="pill"/><text x="231" y="39" class="mono">call spread</text>
    <rect x="380" y="0" width="175" height="64" rx="32" class="pill"/><text x="405" y="39" class="mono">perpetual</text>
    <text x="0" y="115" class="body">Do they observe the same state?</text>
    <text x="0" y="164" class="body">Does the payoff really span?</text>
    <text x="0" y="213" class="body">Can every leg fill?</text>
    <text x="0" y="262" class="body">Who recognizes the offset?</text>
    <text x="0" y="311" class="body">What becomes legally final?</text>
    <text x="0" y="360" class="body">Can every release path recover?</text>
    <rect x="0" y="405" width="555" height="105" rx="12" fill="#f8e8e5" stroke="#9b3a37" stroke-width="2"/>
    <text x="25" y="450" class="big" style="font-size:36px">“Related” is not “complete.”</text>
    <text x="25" y="486" class="mono">Residuals stay visible.</text>
  </g>
  <text x="80" y="858" class="mono">Original Statebook teaching artifact · illustration, not evidence · 15 July 2026</text>
</svg>
