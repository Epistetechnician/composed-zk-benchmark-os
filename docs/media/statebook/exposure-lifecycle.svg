<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Capacity is released by proof, not time</title>
  <desc id="desc">An exposure moves from request to reservation, submission, observation, and validated finality. Challenge, expiry, and reconciliation are separate non-final states. Time alone never releases capacity.</desc>
  <defs><style>.ink{fill:#162b45}.muted{fill:#667789}.h{font:700 56px Georgia,serif}.t{font:700 27px Georgia,serif}.b{font:25px Georgia,serif}.k{font:700 22px ui-monospace,Consolas,monospace;letter-spacing:1.5px}.x{font:21px ui-monospace,Consolas,monospace}.navy{fill:#fffdfa;stroke:#173a63;stroke-width:3}.teal{fill:#edf7f4;stroke:#19766f;stroke-width:3}.gold{fill:#fff3cf;stroke:#c38508;stroke-width:3}.red{fill:#fbe9e7;stroke:#b3423c;stroke-width:3}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#173a63"/></marker></defs>
  <rect width="1600" height="900" fill="#fbf8f1"/>
  <text x="70" y="72" class="k ink">FIG 07 / EXACTLY-ONCE EXPOSURE ACCOUNTING</text>
  <text x="70" y="136" class="h ink">Capacity is released by proof, not time.</text>
  <text x="70" y="178" class="b muted">Every transition is digest-bound, observable, and reconciled before normal operation resumes.</text>
  <g>
    <rect x="70" y="250" width="250" height="174" rx="18" class="navy"/><text x="100" y="306" class="t ink">1 / Request</text><text x="100" y="350" class="x muted"><tspan x="100">intent · amount</tspan><tspan x="100" dy="24">route</tspan></text>
    <rect x="350" y="250" width="250" height="174" rx="18" class="gold"/><text x="380" y="306" class="t ink">2 / Reserve</text><text x="380" y="350" class="x muted"><tspan x="380">gross outbound</tspan><tspan x="380" dy="24">cap</tspan></text>
    <rect x="630" y="250" width="250" height="174" rx="18" class="navy"/><text x="660" y="306" class="t ink">3 / Submit</text><text x="660" y="350" class="x muted"><tspan x="660">exactly-once</tspan><tspan x="660" dy="24">id</tspan></text>
    <rect x="910" y="250" width="250" height="174" rx="18" class="navy"/><text x="940" y="306" class="t ink">4 / Observe</text><text x="940" y="350" class="x muted"><tspan x="940">in-flight</tspan><tspan x="940" dy="24">ledger</tspan></text>
    <rect x="1190" y="250" width="340" height="174" rx="18" class="teal"/><text x="1220" y="298" class="t ink"><tspan x="1220">5 / Finalize or</tspan><tspan x="1220" dy="31">no-outflow</tspan></text><text x="1220" y="364" class="x muted"><tspan x="1220">validated capacity</tspan><tspan x="1220" dy="24">release</tspan></text>
  </g>
  <path d="M320 326H350" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 326H630" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 326H910" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 326H1190" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1035 424V496" fill="none" stroke="#173a63" stroke-width="3"/>
  <path d="M1035 496H260V550" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1035 496H730V550" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1035 496H1270V550" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="70" y="550" width="380" height="140" rx="18" class="red"/><text x="102" y="604" class="t ink">Challenge or freeze</text><text x="102" y="648" class="x muted">blocks new reservation</text>
  <rect x="540" y="550" width="380" height="140" rx="18" class="gold"/><text x="572" y="604" class="t ink">Expiry or revalidation</text><text x="572" y="648" class="x muted">does not release dispute</text>
  <rect x="1010" y="550" width="520" height="140" rx="18" class="navy"/><text x="1042" y="604" class="t ink">Reconcile and recover</text><text x="1042" y="646" class="x muted"><tspan x="1042">evidence · liabilities ·</tspan><tspan x="1042" dy="24">canary reopen</tspan></text>
  <rect x="70" y="790" width="1460" height="48" rx="12" class="red"/>
  <text x="98" y="822" class="k ink">INVARIANT / TIMEOUT NEVER RESTORES CAPACITY; ONLY OBSERVED FINALITY OR VALIDATED NO-OUTFLOW DOES.</text>
</svg>
