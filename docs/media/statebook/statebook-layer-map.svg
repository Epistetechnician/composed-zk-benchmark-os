<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Statebook is a coherence layer</title>
  <desc id="desc">Federated source books supply declared terms to a semantic coherence core. The core emits separate economic, execution, and assurance graphs. HSAI supplies bounded evidence only. The diagram explicitly excludes authority.</desc>
  <defs>
    <style>
      .ink{fill:#162b45}.muted{fill:#667789}.h{font:700 56px Georgia,serif}.t{font:700 27px Georgia,serif}.b{font:25px Georgia,serif}.k{font:700 21px ui-monospace,Consolas,monospace;letter-spacing:1.6px}.x{font:21px ui-monospace,Consolas,monospace}.navy{fill:#fffdfa;stroke:#173a63;stroke-width:3}.teal{fill:#edf7f4;stroke:#19766f;stroke-width:3}.gold{fill:#fff3cf;stroke:#c38508;stroke-width:3}.red{fill:#fbe9e7;stroke:#b3423c;stroke-width:3}.dash{fill:#edf7f4;stroke:#19766f;stroke-width:3;stroke-dasharray:10 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#173a63"/></marker>
    <marker id="teal-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#19766f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fbf8f1"/>
  <text x="70" y="66" class="k ink">FIG 12 / ARCHITECTURE BOUNDARY</text>
  <text x="70" y="126" class="h ink">Statebook is a coherence layer.</text>
  <text x="70" y="166" class="b muted">It compares declared relationships across books. It does not become their authority.</text>
  <text x="70" y="216" class="k ink">FEDERATED SOURCE BOOKS / DECLARED TERMS</text>
  <g>
    <rect x="70" y="236" width="270" height="88" rx="16" class="navy"/><text x="96" y="274" class="t ink">Perpetual books</text><text x="96" y="306" class="x muted">marks · funding · collateral</text>
    <rect x="360" y="236" width="270" height="88" rx="16" class="navy"/><text x="386" y="274" class="t ink">Event books</text><text x="386" y="306" class="x muted">conditions · disputes · expiry</text>
    <rect x="650" y="236" width="270" height="88" rx="16" class="navy"/><text x="676" y="274" class="t ink">Options and futures</text><text x="676" y="306" class="x muted">strikes · delivery · exercise</text>
    <rect x="940" y="236" width="270" height="88" rx="16" class="navy"/><text x="966" y="274" class="t ink">Standards and law</text><text x="966" y="306" class="x muted">definitions · finality · rules</text>
    <rect x="1230" y="236" width="300" height="88" rx="16" class="navy"/><text x="1256" y="274" class="t ink">Frontier references</text><text x="1256" y="306" class="x muted">compute · power · policy</text>
  </g>
  <path d="M205 324V365H800V398 M495 324V365 M785 324V365 M1075 324V365 M1380 324V365" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="250" y="398" width="980" height="156" rx="22" class="gold"/>
  <text x="292" y="440" class="k ink">SEMANTIC COHERENCE CORE</text>
  <rect x="292" y="462" width="260" height="58" rx="12" class="navy"/><text x="320" y="500" class="t ink">Validated terms</text>
  <rect x="610" y="462" width="200" height="58" rx="12" class="navy"/><text x="640" y="500" class="t ink">StateKey</text>
  <rect x="868" y="462" width="320" height="58" rx="12" class="navy"/><text x="896" y="500" class="t ink">Payoff and residual</text>
  <text x="292" y="542" class="x muted">exact source binding · material state identity · explicit unsupported states</text>
  <rect x="1280" y="398" width="250" height="156" rx="22" class="dash"/>
  <text x="1310" y="440" class="k ink">HSAI</text><text x="1310" y="480" class="t ink">Bounded evidence</text><text x="1310" y="516" class="x muted">inputs only</text>
  <path d="M1280 476H1230" fill="none" stroke="#19766f" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#teal-arrow)"/>
  <path d="M740 554V610 M740 610H305 M740 610H800 M740 610H1295" fill="none" stroke="#173a63" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="70" y="604" class="k ink">THREE LINKED GRAPHS / INDEPENDENT QUESTIONS</text>
  <rect x="70" y="630" width="440" height="122" rx="18" class="teal"/><text x="102" y="672" class="t ink">Economic state graph</text><text x="102" y="710" class="x muted">payoffs · comparators · maturity</text>
  <rect x="580" y="630" width="440" height="122" rx="18" class="teal"/><text x="612" y="672" class="t ink">Execution graph</text><text x="612" y="710" class="x muted">books · size · slippage · legs</text>
  <rect x="1090" y="630" width="440" height="122" rx="18" class="teal"/><text x="1122" y="672" class="t ink">Assurance and release graph</text><text x="1122" y="710" class="x muted">evidence · budgets · queue · recovery</text>
  <rect x="70" y="804" width="1460" height="44" rx="12" class="red"/>
  <text x="98" y="833" class="k ink">AUTHORITY BOUNDARY / NO EXECUTION · CUSTODY · MARGIN RECOGNITION · PAUSE · SIGNING · SETTLEMENT</text>
</svg>
