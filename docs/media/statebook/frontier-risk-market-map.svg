<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Frontier-risk market map</title>
  <desc id="desc">A map of AI, compute, chips, energy, labour, cyber, climate, policy, and macroeconomic risks connected through a Statebook while retaining distinct references and finality domains.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3d776f"/></marker><style>.h{font:700 52px Georgia,serif;fill:#17283b}.sub{font:20px 'Courier New',monospace;fill:#5f6b73}.t{font:700 24px Georgia,serif;fill:#17283b}.s{font:17px 'Courier New',monospace;fill:#5f6b73}.box{fill:#fffdf8;stroke:#1e3a5f;stroke-width:2}.ai{fill:#edf3f0;stroke:#3d776f;stroke-width:2}.macro{fill:#f6edcf;stroke:#b78619;stroke-width:2}.risk{fill:#f8e8e5;stroke:#9b3a37;stroke-width:2}.edge{fill:none;stroke:#3d776f;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#faf7ef"/>
  <text x="75" y="75" class="h">Frontier-risk markets</text><text x="75" y="112" class="sub">New payoff forms emerge faster than common semantics, infrastructure, and law.</text>
  <rect x="610" y="330" width="380" height="210" rx="28" class="macro"/>
  <text x="680" y="395" class="h" style="font-size:46px">STATEBOOK</text><text x="666" y="438" class="sub">state identity · payoff · residual</text><text x="678" y="476" class="sub">execution · capital · finality</text><text x="704" y="514" class="sub">assurance · recovery</text>
  <g transform="translate(80 165)"><rect width="330" height="145" rx="16" class="ai"/><text x="24" y="45" class="t">Compute capacity</text><text x="24" y="78" class="s">GPU hours · latency · region</text><text x="24" y="106" class="s">availability · benchmark</text></g>
  <g transform="translate(470 145)"><rect width="300" height="135" rx="16" class="ai"/><text x="24" y="44" class="t">Chips &amp; packaging</text><text x="24" y="78" class="s">delivery · yield · controls</text><text x="24" y="106" class="s">capacity · obsolescence</text></g>
  <g transform="translate(830 145)"><rect width="300" height="135" rx="16" class="ai"/><text x="24" y="44" class="t">Model capability</text><text x="24" y="78" class="s">benchmarks · reliability</text><text x="24" y="106" class="s">cost · methodology drift</text></g>
  <g transform="translate(1190 165)"><rect width="330" height="145" rx="16" class="risk"/><text x="24" y="45" class="t">Cyber &amp; protocol</text><text x="24" y="78" class="s">oracle · bridge · exploit</text><text x="24" y="106" class="s">identity · correlated roots</text></g>
  <g transform="translate(80 600)"><rect width="330" height="145" rx="16" class="macro"/><text x="24" y="45" class="t">Power &amp; grid</text><text x="24" y="78" class="s">location · congestion</text><text x="24" y="106" class="s">curtailment · interconnect</text></g>
  <g transform="translate(470 630)"><rect width="300" height="135" rx="16" class="macro"/><text x="24" y="44" class="t">Labour &amp; adoption</text><text x="24" y="78" class="s">tasks · skills · diffusion</text><text x="24" y="106" class="s">productivity · displacement</text></g>
  <g transform="translate(830 630)"><rect width="300" height="135" rx="16" class="macro"/><text x="24" y="44" class="t">Policy &amp; trade</text><text x="24" y="78" class="s">sanctions · export controls</text><text x="24" y="106" class="s">privacy · market rules</text></g>
  <g transform="translate(1190 600)"><rect width="330" height="145" rx="16" class="risk"/><text x="24" y="45" class="t">Macro &amp; climate</text><text x="24" y="78" class="s">rates · debt · energy</text><text x="24" y="106" class="s">weather · supply chains</text></g>
  <path d="M410 250C500 250 555 335 610 380" class="edge"/><path d="M620 280C650 310 680 325 700 340" class="edge"/><path d="M980 280C950 310 930 325 915 340" class="edge"/><path d="M1190 250C1100 250 1040 335 990 380" class="edge"/>
  <path d="M410 670C505 670 560 550 630 510" class="edge"/><path d="M620 630C650 590 690 555 720 535" class="edge"/><path d="M980 630C950 590 920 555 895 535" class="edge"/><path d="M1190 670C1100 670 1045 550 970 510" class="edge"/>
  <text x="75" y="840" class="sub">Related underlyings do not imply shared books, margin, oracle governance, or legal finality.</text>
</svg>
