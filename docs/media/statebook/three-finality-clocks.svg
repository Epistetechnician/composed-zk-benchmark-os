<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three finality clocks</title>
  <desc id="desc">Execution finality, economic settlement, and externalization finality are separate clocks. Statebook tracks their distinction and does not treat a quick technical transition as legal or economic finality.</desc>
  <defs><style>.ink{fill:#162b45}.muted{fill:#667789}.h{font:700 56px Georgia,serif}.t{font:700 28px Georgia,serif}.b{font:24px Georgia,serif}.k{font:700 21px ui-monospace,Consolas,monospace;letter-spacing:1.45px}.x{font:21px ui-monospace,Consolas,monospace}.navy{fill:#fffdfa;stroke:#173a63;stroke-width:3}.teal{fill:#edf7f4;stroke:#19766f;stroke-width:3}.gold{fill:#fff3cf;stroke:#c38508;stroke-width:3}.red{fill:#fbe9e7;stroke:#b3423c;stroke-width:3}</style></defs>
  <rect width="1600" height="900" fill="#fbf8f1"/>
  <text x="70" y="72" class="k ink">FIG 05 / THREE FINALITY CLOCKS</text>
  <text x="70" y="136" class="h ink">Fast state. Deliberate irreversible exit.</text>
  <text x="70" y="178" class="b muted">The controls track different clocks because unilateral externalization is not slow internal risk control.</text>

  <text x="70" y="282" class="t ink">1 / Execution finality</text>
  <path d="M510 276H1490" stroke="#173a63" stroke-width="4"/>
  <circle cx="620" cy="276" r="10" fill="#173a63"/>
  <rect x="510" y="306" width="390" height="118" rx="16" class="navy"/>
  <text x="542" y="346" class="b ink">match or engine transition</text>
  <text x="542" y="377" class="x muted"><tspan x="542">venue-local</tspan><tspan x="542" dy="25">irrevocability</tspan></text>

  <text x="70" y="478" class="t ink">2 / Economic settlement</text>
  <path d="M510 472H1490" stroke="#173a63" stroke-width="4"/>
  <circle cx="750" cy="472" r="10" fill="#173a63"/>
  <rect x="510" y="504" width="590" height="116" rx="16" class="teal"/>
  <text x="542" y="542" class="b ink"><tspan x="542">mark · margin lock · liquidation</tspan><tspan x="542" dy="30">loss recognition</tspan></text>
  <text x="542" y="600" class="x muted">fast inside the recovery domain</text>

  <text x="70" y="674" class="t ink">3 / Externalization finality</text>
  <path d="M510 668H1490" stroke="#173a63" stroke-width="4"/>
  <circle cx="1240" cy="668" r="10" fill="#173a63"/>
  <rect x="510" y="690" width="400" height="128" rx="16" class="gold"/>
  <text x="542" y="728" class="b ink">hard gates · budget · clock</text>
  <text x="542" y="772" class="x muted"><tspan x="542">challenge queue</tspan><tspan x="542" dy="25">revalidation</tspan></text>
  <rect x="940" y="690" width="550" height="128" rx="16" class="red"/>
  <text x="972" y="728" class="b ink"><tspan x="972">withdrawal · bridge · collateral reuse</tspan><tspan x="972" dy="30">payout</tspan></text>
  <text x="972" y="792" class="x muted">crosses a separately governed boundary</text>

  <rect x="70" y="842" width="1420" height="38" rx="12" class="red"/>
  <text x="96" y="868" class="k ink">ATOMIC LINKED EXCHANGE MAY REMAIN FAST ONLY WHEN EVERY LEG SETTLES OR NONE DOES.</text>
</svg>
